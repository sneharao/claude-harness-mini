receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 100

exporters:
  file/metrics:
    path: /traces/metrics.jsonl
    rotation:
      max_megabytes: 50
      max_days: 7
  file/logs:
    path: /traces/logs.jsonl
    rotation:
      max_megabytes: 50
      max_days: 7
  file/traces:
    path: /traces/traces.jsonl
    rotation:
      max_megabytes: 50
      max_days: 7
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/metrics, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, debug]
  telemetry:
    logs:
      level: info
