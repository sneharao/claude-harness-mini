services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    container_name: harness-otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
      - ./traces:/traces
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped
